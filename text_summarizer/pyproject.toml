[project]
name = "text-summarizer"
version = "0.1.0"
description = "A text summarization agent built with ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk[mcp,extensions,eval]",
    "google-api-python-client>=2.200.0",
    "langfuse",
    "openinference-instrumentation-google-adk",
    "python-dotenv",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["text_summarizer"]
package-dir = {"text_summarizer" = "."}
