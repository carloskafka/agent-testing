# Uncapped json-file. The ADK dev UI and the MCP server both log per-request.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  obsidian-mcp:
    build:
      context: .
      dockerfile: Dockerfile.obsidian-mcp
    container_name: obsidian-mcp
    restart: unless-stopped
    # Shares agent-testing's network namespace, so these two are only ever
    # correct together: recreating this one alone leaves it attached to the
    # old namespace and every MCP call is refused while it still logs
    # "listening". If you change either service, recreate the pair.
    logging: *logging
    network_mode: service:agent-testing
    depends_on:
      - agent-testing
    environment:
      # Which child of the mount to serve. Optional when the parent holds one
      # vault; required when it holds several. Kept in sync with the agent's
      # SECOND_BRAIN_VAULT by construction -- both read the same variable.
      VAULT_NAME: ${OBSIDIAN_VAULT_NAME:-}
      # resolve-vault.sh passes this to `obsidian-mcp --port`, so it is the only
      # way the documented override reaches the server. It has to be named here
      # explicitly: env_file applies to the agent-testing service only, so this
      # service never sees .env and every value in it silently fell back to the
      # script's own 37842 default.
      OBSIDIAN_MCP_PORT: ${OBSIDIAN_MCP_PORT:-37842}
      # Same zone as the agent, so file timestamps and logs agree across the pair.
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      # Host directory whose children are Obsidian vaults (auto-created as
      # "agent-vault" if empty). Override with OBSIDIAN_VAULT_PARENT_HOST in .env.
      - ${OBSIDIAN_VAULT_PARENT_HOST:-./vaults}:/vaults

  agent-testing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-testing
    restart: unless-stopped
    logging: *logging
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      LANGFUSE_BASE_URL: http://host.docker.internal:3099
      # Named for the agreed convention with the SearXNG compose project rather
      # than by IP, so moving either project cannot silently point at the wrong
      # host. Leave blank to run without the web tier; build_web_search_tools()
      # returns [] when it is unset.
      SEARXNG_URL: ${SEARXNG_URL:-}
      # Derived from the same variable the sidecar listens on, so the two can never
      # drift: moving OBSIDIAN_MCP_PORT moves the server and this address together.
      # Both containers share a network namespace, hence 127.0.0.1.
      OBSIDIAN_MCP_URL: http://127.0.0.1:${OBSIDIAN_MCP_PORT:-37842}/mcp
      # The vault's PARENT is mounted, not the vault itself, so the real vault
      # directory name survives in the path. resolve_vault_root() picks the active
      # vault out of it, which makes the name that renders in every **Sources** line
      # fully dynamic -- rename the vault folder on the host and it follows, with no
      # name configured anywhere. With several vaults in the parent, set
      # OBSIDIAN_VAULT_NAME in .env to choose; run.sh can prompt for it.
      SECOND_BRAIN_VAULT: /vaults
      OBSIDIAN_VAULT_NAME: ${OBSIDIAN_VAULT_NAME:-}
      # The container's wall clock. `current_datetime("local")` and the day-scoped
      # cache key both read it, and an image defaults to UTC, which is the wrong
      # day for several hours every evening in Sao Paulo (UTC-3). The standard TZ
      # variable rather than a project-specific one: libc and Python both honour it.
      TZ: ${TZ:-America/Sao_Paulo}
      # Headless-browser renderer, for pages a plain HTTP GET cannot read. A
      # SEPARATE compose project (~/Downloads/apps/chromium) reached over the same
      # bridge, for the same reason SearXNG is: a service name on a private network
      # instead of a published port. Empty by default, so an unconfigured agent is
      # byte-for-byte unchanged and web_fetch simply never falls back.
      RENDERER_URL: ${RENDERER_URL:-}
    networks:
      # Default, plus the external bridge shared with the SearXNG project so the web
      # tier can reach it as a service name. Declared external because this repo does
      # not own it -- `run.sh` creates it idempotently before `docker compose up`.
      # The obsidian-mcp sidecar is unaffected: it uses
      # `network_mode: service:agent-testing` and inherits this namespace, which is
      # also why a `networks:` key on *it* would be rejected by compose.
      - default
      - agent-net
    volumes:
      - ${OBSIDIAN_VAULT_PARENT_HOST:-./vaults}:/vaults
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  # Shared with the self-hosted SearXNG project (a SEPARATE compose project, not in
  # this repository) so the web tier reaches it as a service name rather than
  # through a published host port. Declared external because this repo does not own
  # it: compose will not create an external network, and it fails with "declared as
  # external, but could not be found" rather than creating one. run.sh creates it
  # idempotently when SEARXNG_URL is configured; an unconfigured agent leaves it
  # alone and needs no network at all.
  agent-net:
    external: true
    name: agent-net